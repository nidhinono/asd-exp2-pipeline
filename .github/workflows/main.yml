name: ASD DevOps Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js Environment
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Run Application Build
        run: |
          echo "Compiling source code and preparing dependencies..."
          echo "Build successful!"

      - name: Execute Automated Unit Tests
        run: |
          echo "Running unit test suites..."
          echo "Test 1: Passed"
          echo "Test 2: Passed"
          echo "All automated tests executed successfully!"
